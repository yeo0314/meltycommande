<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>melty · Commander</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sacramento&display=swap" rel="stylesheet">
<style>
/* ---------- COULEURS (modifie-les ici) ---------- */
:root{--bg:#FFFFFF;--ink:#655A7C;--muted:#817792;--accent:#AB92BF;--line:#D6C6DC;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#FFFFFF;--ink:#655A7C;--muted:#817792;--accent:#AB92BF;--line:#D6C6DC}}
:root[data-theme="dark"]{--bg:#FFFFFF;--ink:#655A7C;--muted:#817792;--accent:#AB92BF;--line:#D6C6DC}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-weight:400;line-height:1.6}
main{max-width:480px;margin:0 auto;padding:48px 24px 140px}
header{text-align:center;margin-bottom:48px}
.logo{font-family:"Sacramento","Brush Script MT",cursive;font-weight:400;font-size:3.4rem;line-height:1;color:var(--accent);margin:0}
.sub{color:var(--muted);margin:6px 0 0;font-size:.95rem}
h2{font-weight:400;font-size:.95rem;letter-spacing:.04em;color:var(--muted);margin:44px 0 6px}
.item{display:flex;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.info{flex:1;min-width:0}
.info b{font-weight:500;display:block}
.info span{display:block;color:var(--muted);font-size:.88rem}
.price{white-space:nowrap}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:1.2rem;cursor:pointer}
.qty button:hover{border-color:var(--accent)}
.qty output{min-width:18px;text-align:center}
label.f{display:block;margin-top:20px;font-size:.88rem;color:var(--muted)}
input,select{width:100%;margin-top:4px;padding:10px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;color:var(--ink);font:inherit;font-size:1rem}
input:focus,select:focus{outline:0;border-color:var(--accent)}
button:focus-visible,.send:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.note{color:var(--muted);font-size:.88rem;margin-top:22px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:480px;margin:0 auto;display:flex;gap:16px;align-items:center}
.tot{flex:none;font-weight:500}
.tot small{display:block;color:var(--muted);font-weight:300}
.send{flex:1;text-align:center;border:1px solid var(--accent);color:var(--accent);text-decoration:none;font-weight:500;padding:13px;border-radius:2px}
.send:hover{background:var(--accent);color:var(--bg)}
.send[aria-disabled=true]{opacity:.35;pointer-events:none}
@media(max-width:600px){
  .bar{bottom:56px;padding-bottom:14px}
  .bar>div{gap:10px}
  .tot{font-size:.9rem}
  .send{padding:12px 8px;font-size:.9rem}
}
body{background:#FFFFFF}
.checkout{width:min(1120px,calc(100% - 48px));max-width:none;margin:42px auto;padding:26px 32px 38px;background:var(--bg);border:1px solid var(--accent)}
.checkout-header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.checkout-header .logo{font-size:2.6rem;text-align:left;color:#7A5C00}
.checkout-steps{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:.65rem;letter-spacing:.06em;text-transform:uppercase}
.checkout-steps .active{color:var(--ink);font-weight:600}
.checkout-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,.8fr);gap:42px;padding-top:22px}
.checkout-main h2,.summary h2{margin:8px 0 14px;color:var(--ink);font-family:Georgia,serif;font-size:1.28rem;font-weight:400;letter-spacing:0}
.item{display:flex;align-items:center;gap:16px;padding:17px 0;border-bottom:1px solid var(--line)}
.info b{color:var(--ink);font-weight:500}
.price{color:var(--ink);font-size:.86rem}
.qty{gap:8px}
.qty button{width:30px;height:30px;border-radius:0;border-color:var(--accent);font-size:1rem}
.customer-section{margin-top:28px}
.customer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
label.f{margin-top:12px;color:var(--ink);font-size:.76rem}
input,select{padding:8px 2px;border-bottom-color:var(--accent);font-size:.88rem}
.note{margin:12px 0 0;font-size:.78rem;line-height:1.5}
#info{min-height:20px}
.summary{padding-left:28px;border-left:1px solid var(--line)}
.summary h2{margin-bottom:18px}
.summary-count{margin:-8px 0 18px;color:var(--muted);font-size:.78rem}
.summary-row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--line);font-size:.8rem}
.summary-row strong{font-weight:500;white-space:nowrap}
.summary-row.total{margin-top:2px;padding-top:16px;font-size:.94rem;font-weight:600}
.summary-note{margin:20px 0;color:var(--muted);font-size:.74rem;line-height:1.5}
.bar{position:static;background:none;border:0;padding:0}
.bar>div{display:block;max-width:none;margin:0}
.send{display:flex;align-items:center;justify-content:center;min-height:44px;padding:12px 14px;border:1px solid var(--ink);border-radius:0;background:var(--accent);color:var(--ink);font-size:.68rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.send:hover{background:var(--ink);color:var(--bg)}
.send[aria-disabled=true]{opacity:.45}
@media(max-width:700px){
  .checkout{width:100%;min-height:100vh;margin:0;padding:18px 18px 130px;border:0}
  .checkout-header{align-items:flex-start;flex-direction:column;gap:10px;padding-bottom:14px}
  .checkout-header .logo{font-size:2.35rem}
  .checkout-steps{width:100%;justify-content:space-between;gap:8px;font-size:.59rem}
  .checkout-layout{grid-template-columns:1fr;gap:32px;padding-top:16px}
  .checkout-main h2,.summary h2{font-size:1.2rem}
  .summary{padding:22px 0 0;border-top:1px solid var(--line);border-left:0}
  .customer-grid{grid-template-columns:1fr;column-gap:0}
  .bar{position:fixed;z-index:5;left:0;right:0;bottom:56px;padding:12px 18px;background:var(--bg);border-top:1px solid var(--line)}
  .bar>div{max-width:560px;margin:0 auto}
}
</style>
</head>
<body>
<main class="checkout">
  <header class="checkout-header">
    <h1 class="logo">melty</h1>
    <nav class="checkout-steps" aria-label="Étapes de commande"><span class="active">Panier</span><span>→</span><span>Livraison</span><span>→</span><span>WhatsApp</span></nav>
  </header>
  <div class="checkout-layout">
    <div class="checkout-main">
      <section class="cart-section">
        <h2>Ton panier</h2>
        <div id="menu"></div>
      </section>
      <section class="customer-section">
        <h2>Tes coordonnées</h2>
        <div class="customer-grid">
          <label class="f">Prénom<input id="nom" autocomplete="given-name"></label>
          <label class="f">Téléphone<input id="telephone" type="tel" autocomplete="tel" inputmode="tel"></label>
          <label class="f">Retrait ou livraison<select id="mode"><option value="livraison">Livraison</option><option value="retrait">Retrait sur place</option></select></label>
          <label class="f" id="zoneLabel">Zone de livraison<select id="zone"><option value="cocody">Cocody — 1 500 FCFA</option><option value="eloignee">Zone éloignée — 2 000 FCFA</option></select></label>
          <label class="f" id="adresseLabel">Quartier ou adresse<input id="adresse" autocomplete="street-address"></label>
          <label class="f">Date souhaitée<input id="date" type="text" inputmode="numeric" placeholder="JJ/MM/AAAA" maxlength="10" autocomplete="off"></label>
          <label class="f">Paiement<select id="paiement"></select></label>
          <p class="note" id="deliveryInfo">Livraison : 1 500 FCFA à Cocody, 2 000 FCFA pour les zones éloignées.</p>
          <p class="note" id="info"></p>
        </div>
      </section>
    </div>
    <aside class="summary">
      <h2>Total</h2>
      <p class="summary-count" id="nb">0 cookie</p>
      <div class="summary-row"><span>Sous-total</span><strong id="subtotal">0 FCFA</strong></div>
      <div class="summary-row"><span>Livraison</span><strong id="fee">—</strong></div>
      <div class="summary-row total"><span>À payer</span><strong id="tot">0 FCFA</strong></div>
      <p class="summary-note">Le paiement sera confirmé avec toi sur WhatsApp.</p>
      <div class="bar"><div><a class="send" id="send" href="#" target="_blank" rel="noopener" aria-disabled="true">Continuer sur WhatsApp</a></div></div>
    </aside>
  </div>
</main>

<script>
/* ============ CONFIGURATION : tout ce que tu peux modifier facilement ============ */
var WHATSAPP = "2250105344052";   // ton numéro : indicatif + numéro, sans + ni espaces
var DEVISE   = "FCFA";
var INFO     = "Un message WhatsApp s'ouvre, prêt à envoyer.";

// Moyens de paiement proposés (ajoute, retire ou renomme)
var PAIEMENTS = ["Wave", "Orange Money", "MTN Money", "Espèces à la livraison"];

// Produits : n = nom, d = description, p = prix. Pour en ajouter, copie une ligne.
var PRODUITS = [
  {n:"Classique XXL", d:"Très épais et généreux, pépites de chocolat", p:1000},
  {n:"Fondant",       d:"Ultra chocolaté, cœur coulant",               p:1200},
  {n:"Premium",       d:"Chocolat noir, noix et fleur de sel",         p:1500},
  {n:"Girly",         d:"Rose et gourmand, toppings colorés",          p:1200}
];
/* ================================================================================= */

var q = PRODUITS.map(function(){ return 0 });          // quantités choisies
var $ = function(id){ return document.getElementById(id) };
var fmt = function(n){ return n.toLocaleString("fr-FR") };

function dateValideFR(valeur){
  if(!valeur) return true;
  var morceaux = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(valeur);
  if(!morceaux) return false;
  var jour = Number(morceaux[1]), mois = Number(morceaux[2]), annee = Number(morceaux[3]);
  var date = new Date(annee, mois - 1, jour);
  return date.getFullYear() === annee && date.getMonth() === mois - 1 && date.getDate() === jour;
}

$("info").textContent = INFO;
PAIEMENTS.forEach(function(m){ var o = document.createElement("option"); o.textContent = m; $("paiement").appendChild(o) });

// Construit la liste des produits
PRODUITS.forEach(function(x, i){
  var d = document.createElement("div"); d.className = "item";
  d.innerHTML = '<div class="info"><b>'+x.n+'</b><span>'+x.d+'</span></div>'
    + '<div class="price">'+fmt(x.p)+' '+DEVISE+'</div>'
    + '<div class="qty"><button type="button" aria-label="Retirer">−</button><output>0</output><button type="button" aria-label="Ajouter">+</button></div>';
  var b = d.querySelectorAll("button"), o = d.querySelector("output");
  b[0].onclick = function(){ if(q[i] > 0){ q[i]--; o.textContent = q[i]; maj() } };
  b[1].onclick = function(){ q[i]++; o.textContent = q[i]; maj() };
  $("menu").appendChild(d);
});

// Met à jour le total et le lien WhatsApp
function maj(){
  var totalCookies = 0, nb = 0, lignes = [];
  q.forEach(function(k, i){ if(k){ totalCookies += k*PRODUITS[i].p; nb += k; lignes.push("- "+k+" x "+PRODUITS[i].n) } });
  var livraison = $("mode").value === "livraison";
  var zone = $("zone").value;
  var fraisLivraison = livraison && nb ? (zone === "cocody" ? 1500 : 2000) : 0;
  var total = totalCookies + fraisLivraison;
  $("subtotal").textContent = fmt(totalCookies)+" "+DEVISE;
  $("tot").textContent = fmt(total)+" "+DEVISE;
  $("nb").textContent = nb+(nb > 1 ? " cookies" : " cookie");
  $("fee").textContent = fraisLivraison ? fmt(fraisLivraison)+" "+DEVISE : "—";
  var a = $("send");
  var nom = $("nom").value.trim(), telephone = $("telephone").value.trim(), adresse = $("adresse").value.trim();
  var dateSouhaitee = $("date").value.trim();
  var manque = [];
  if(!nb) manque.push("choisis au moins un cookie");
  if(!nom) manque.push("indique ton prénom");
  if(!telephone) manque.push("indique le téléphone du destinataire");
  if(livraison && !adresse) manque.push("indique l'adresse de livraison");
  if(!dateValideFR(dateSouhaitee)) manque.push("saisis une date valide au format JJ/MM/AAAA");
  var pret = manque.length === 0;
  a.setAttribute("aria-disabled", pret ? "false" : "true");
  a.setAttribute("tabindex", pret ? "0" : "-1");
  $("info").textContent = pret ? INFO : "Pour continuer, "+manque.join(", ")+".";
  $("zoneLabel").style.display = livraison ? "block" : "none";
  $("adresse").parentElement.style.display = livraison ? "block" : "none";
  $("deliveryInfo").style.display = livraison ? "block" : "none";
  var msg = "Bonjour melty ! Je souhaite commander :\n"+lignes.join("\n")
    + "\nTotal cookies : "+fmt(totalCookies)+" "+DEVISE
    + (livraison ? "\nZone de livraison : "+(zone === "cocody" ? "Cocody" : "Zone éloignée")+"\nFrais de livraison : "+fmt(fraisLivraison)+" "+DEVISE : "")
    + "\nTotal à payer : "+fmt(total)+" "+DEVISE
    + "\n\nPrénom : "+(nom || "-")
    + "\nTéléphone du destinataire : "+(telephone || "-")
    + "\nMode : "+(livraison ? "Livraison" : "Retrait sur place")
    + (livraison ? "\nAdresse : "+(adresse || "-") : "")
    + "\nDate souhaitée : "+(dateSouhaitee || "-")
    + "\nPaiement : "+$("paiement").value;
  a.href = pret ? "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg) : "#";
}
["nom","telephone","mode","zone","adresse","date","paiement"].forEach(function(id){ $(id).addEventListener("input", maj); $(id).addEventListener("change", maj) });
maj();
</script>
</body>
</html>
